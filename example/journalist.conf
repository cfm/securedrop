ServerName 127.0.0.1

# Shared daemon — referenced by both VirtualHosts below
WSGIDaemonProcess journalist processes=2 threads=30 display-name=%{GROUP} python-path=/var/www/securedrop

# External VirtualHost — Tor-accessible
<VirtualHost 127.0.0.1:8080>

# Route the two heavy API endpoints to the Rust service to avoid heap bloat
# in the long-lived mod_wsgi daemon processes.
<Location "/api/v1/token">
    ProxyPass        "http://127.0.0.1:8082/api/v1/token"
    ProxyPassReverse "http://127.0.0.1:8082/api/v1/token"
</Location>
<Location "/api/v2/index">
    ProxyPass        "http://127.0.0.1:8082/api/v2/index"
    ProxyPassReverse "http://127.0.0.1:8082/api/v2/index"
</Location>
<Location "/api/v2/data">
    ProxyPass        "http://127.0.0.1:8082/api/v2/data"
    ProxyPassReverse "http://127.0.0.1:8082/api/v2/data"
</Location>
<Location "/api/v2/metadata">
    ProxyPass        "http://127.0.0.1:8082/api/v2/metadata"
    ProxyPassReverse "http://127.0.0.1:8082/api/v2/metadata"
</Location>

WSGIScriptAlias / /var/www/journalist.wsgi process-group=journalist application-group=journalist
WSGIPassAuthorization On

Header set Cache-Control "no-store"

XSendFile        On
XSendFilePath    /var/lib/securedrop/store/
XSendFilePath    /var/lib/securedrop/tmp/

Header edit Set-Cookie ^(.*)$ $1;HttpOnly

Header onsuccess unset X-Frame-Options
Header always set X-Frame-Options "DENY"
Header onsuccess unset Referrer-Policy
Header always set Referrer-Policy "no-referrer"
Header onsuccess unset Cross-Origin-Opener-Policy
Header always set Cross-Origin-Opener-Policy "same-origin"
Header onsuccess unset Cross-Origin-Embedder-Policy
Header always set Cross-Origin-Embedder-Policy "same-origin"
Header onsuccess unset Cross-Origin-Resource-Policy
Header always set Cross-Origin-Resource-Policy "same-origin"

Header onsuccess unset X-Content-Type-Options
Header always set X-Content-Type-Options "nosniff"

Header onsuccess unset Content-Security-Policy
Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; frame-ancestors 'none';"

LimitRequestBody 524288000

<Directory />
  Options None
  AllowOverride None
  Require all denied
</Directory>

<Directory /var/www/>
  Options None
  AllowOverride None
  <Limit GET POST HEAD DELETE>
    Require ip 127.0.0.1
  </Limit>
  <LimitExcept GET POST HEAD DELETE>
    Require all denied
  </LimitExcept>
</Directory>

<Directory /var/www/securedrop>
  Options None
  AllowOverride None
  <Limit GET POST HEAD DELETE>
    Require ip 127.0.0.1
  </Limit>
  <LimitExcept GET POST HEAD DELETE>
    Require all denied
  </LimitExcept>
</Directory>

Alias /static /var/www/securedrop/static
<Directory /var/www/securedrop/static>
  Require all granted
  Header set Cache-Control "max-age=3600"
</Directory>

RewriteEngine On
RewriteCond %{THE_REQUEST} !HTTP/1\.1$
RewriteRule .* - [F]

ErrorLog /var/log/apache2/journalist-error.log
CustomLog /var/log/apache2/journalist-access.log combined
LogLevel info

</VirtualHost>
